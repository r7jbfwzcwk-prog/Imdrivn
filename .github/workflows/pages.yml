# Deploy the static site at the repository root to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One production deployment at a time. Do not cancel a deploy that is in progress.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to publish an older main
        run: |
          git fetch origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          echo "This run is ${head}. origin/main is ${main}."
          if [ "$head" != "$main" ]; then
            echo "A newer main already exists. Not publishing this older snapshot."
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Keep the Google site verification file
        run: |
          file="google5de324c3171fd333.html"
          expected="google-site-verification: google5de324c3171fd333.html"
          test -f "$file" || { echo "Missing $file"; exit 1; }
          actual="$(tr -d '\r\n' < "$file")"
          if [ "$actual" != "$expected" ]; then
            echo "Google verification file was removed or rewritten."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
